<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>PersonalTelegram Ultra</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111b2c;--line:#293950;--text:#edf3ff;--muted:#93a5bf;--blue:#79a0ff;--bubble:#1b2a40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:310px 1fr;max-width:1500px;margin:auto}.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{padding:20px;font-size:19px;font-weight:850;color:var(--blue)}.search{margin:0 14px 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}.list{overflow:auto;flex:1;padding:0 8px}.chat{padding:12px;display:flex;align-items:center;gap:11px;border-radius:13px;cursor:pointer}.chat:hover,.chat.active{background:#233653}.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#548ce8,#9864cf);display:grid;place-items:center;font-weight:800;flex-shrink:0}.meta{min-width:0;flex:1}.name{font-weight:800;font-size:13px}.preview{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:4px}.sidefoot{padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.main{display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at top,#192943,var(--bg) 65%)}.header{display:flex;align-items:center;gap:12px;padding:12px 18px;height:70px;background:#111b2cdd;border-bottom:1px solid var(--line)}.headinfo{flex:1}.headinfo small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.iconbtn{border:0;background:transparent;color:var(--muted);font-size:19px;padding:8px;border-radius:10px}.iconbtn:hover{background:#233653}.msgs{flex:1;overflow:auto;padding:22px clamp(12px,4vw,55px);display:flex;flex-direction:column;gap:12px}.date{align-self:center;color:var(--muted);font-size:10px;background:#19283e;border:1px solid var(--line);padding:6px 12px;border-radius:20px}.msg{max-width:80%;align-self:flex-start;background:var(--bubble);border:1px solid #2b3b54;border-radius:16px 16px 16px 5px;padding:11px 13px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#355e9b,#4c4d96);border-radius:16px 16px 5px 16px}.time{font-size:9px;text-align:right;color:#c0cee1;margin-top:5px}.composewrap{padding:8px 16px max(12px,env(safe-area-inset-bottom));background:#111b2caa}.note{text-align:center;color:#71849f;font-size:10px;padding:3px 0 9px}.compose{display:flex;gap:8px;align-items:flex-end;padding:7px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.compose textarea{flex:1;min-width:0;resize:none;max-height:120px;min-height:40px;background:transparent;border:0;outline:0;color:var(--text);padding:10px}.send{border:0;border-radius:12px;width:42px;height:42px;background:linear-gradient(135deg,#79a0ff,#9b78ff);color:#091323;font-size:19px;font-weight:bold}.pill{border:1px solid var(--line);background:#1b2a40;color:var(--muted);padding:8px 11px;border-radius:10px}.hidden{display:none!important}.empty{margin:auto;text-align:center;padding:30px}.empty .big{font-size:50px}.empty p{max-width:350px;color:var(--muted);line-height:1.7}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#253956;padding:12px 18px;border-radius:12px;display:none}.toast.show{display:block}body.light{--bg:#edf2fa;--panel:#fff;--line:#d8e0ed;--text:#17243a;--muted:#657791;--bubble:#fff;color-scheme:light}body.light .main{background:#edf2fa}body.light .header{background:#ffffffdd}body.light .chat.active,body.light .chat:hover{background:#e0eaff}
@media(max-width:640px){.app{grid-template-columns:1fr}.side{display:flex}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.header{height:64px;padding:10px}.back{display:inline-block!important}.msgs{padding:15px 10px}.msg{max-width:88%}.composewrap{padding-left:8px;padding-right:8px}}.back{display:none}
</style></head><body><div class="app" id="app"><aside class="side"><div class="brand">➤ PersonalTelegram <small style="display:block;font-size:9px;letter-spacing:2px;color:var(--muted)">ULTRA DEMO</small></div><input id="search" class="search" placeholder="⌕ Пошук чатів..."><div style="padding:0 17px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:800">ТВОЇ ЧАТИ <button class="pill" id="new">＋ Новий</button></div><div class="list" id="list"></div><div class="sidefoot"><span id="profileLabel">☺ Твій профіль</span> <button class="pill" id="profile">Змінити</button><button class="pill" id="theme">◐ Тема</button></div></aside><main class="main"><header class="header"><button class="iconbtn back" id="back">‹</button><div class="ava" id="headAva">О</div><div class="headinfo"><b id="headName">Обери чат</b><small id="headStatus">Демо-месенджер · локальний режим</small></div><button class="iconbtn" id="info" title="Інформація">ⓘ</button></header><section class="msgs" id="msgs"><div class="empty"><div class="big">✉️</div><h2>Твій простір для спілкування</h2><p>Обери чат або створи новий. Це демонстраційний інтерфейс PersonalTelegram Ultra.</p><button class="pill" id="createFirst">＋ Створити демо-чат</button></div></section><div class="composewrap"><div class="note">Демо-режим · повідомлення зберігаються лише в цьому браузері</div><form class="compose" id="form"><button type="button" class="iconbtn" id="emoji">☺</button><textarea id="input" rows="1" maxlength="3000" placeholder="Написати повідомлення..." autocomplete="off"></textarea><button class="send" type="submit">➤</button></form></div></main></div><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id);const seed=[{id:'alex',name:'Олексій',messages:[['them','Привіт! 👋 Ласкаво просимо до PersonalTelegram Ultra.','12:40'],['me','Вау, виглядає круто 😎','12:41'],['them','Можна писати повідомлення, шукати чати й змінювати тему!','12:42']]},{id:'friends',name:'Друзі',messages:[['them','Марко: Побачимось завтра! 👋','11:18']]},{id:'mama',name:'Мама',messages:[['them','Не забудь подзвонити ❤️','Вчора']]},{id:'saved',name:'Збережене',messages:[['them','Твої особисті нотатки можуть бути тут 📝','Пн']]}];let chats;try{chats=JSON.parse(localStorage.ptultra_chats)||seed}catch(e){chats=seed}let current=null;try{current=JSON.parse(localStorage.ptultra_current)}catch(e){}let username=localStorage.ptultra_name||'Твій профіль',light=localStorage.ptultra_light==='1';const initial=n=>(n||'?').trim().slice(0,1).toUpperCase();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.ptultra_chats=JSON.stringify(chats);localStorage.ptultra_current=JSON.stringify(current)}catch(e){}}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function chat(){return chats.find(c=>c.id===current)}function renderList(){let q=$('search').value.toLowerCase();$('list').innerHTML='';chats.filter(c=>(c.name+' '+(c.messages.at(-1)?.[1]||'')).toLowerCase().includes(q)).forEach(c=>{let d=document.createElement('div');d.className='chat'+(c.id===current?' active':'');d.innerHTML='<div class="ava">'+esc(initial(c.name))+'</div><div class="meta"><div class="name">'+esc(c.name)+'</div><div class="preview">'+esc(c.messages.at(-1)?.[1]||'Поки немає повідомлень')+'</div></div>';d.onclick=()=>select(c.id);$('list').append(d)})}function renderMsgs(){let c=chat();if(!c)return;$('headName').textContent=c.name;$('headAva').textContent=initial(c.name);$('msgs').innerHTML='<div class="date">Історія демо · сьогодні</div>';c.messages.forEach(m=>{let d=document.createElement('div');d.className='msg '+(m[0]==='me'?'mine':'');d.innerHTML=esc(m[1])+'<div class="time">'+esc(m[2])+(m[0]==='me'?' ✓✓':'')+'</div>'; $('msgs').append(d)});$('msgs').scrollTop=$('msgs').scrollHeight}function render(){renderList();$('profileLabel').textContent='☺ '+username;document.body.classList.toggle('light',light);if(chat())renderMsgs()}function select(id){current=id;save();render();$('app').classList.add('open')}function create(){let n=prompt('Назва нового демо-чату:');if(!n||!n.trim())return;let id='chat'+Date.now();chats.unshift({id,name:n.trim().slice(0,40),messages:[['them','Чат створено! Це локальна демоверсія.','зараз']]});select(id);toast('Демо-чат створено')}$('new').onclick=$('createFirst').onclick=create;$('search').oninput=renderList;$('back').onclick=()=>$('app').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();let t=$('input').value.trim(),c=chat();if(!t||!c){if(!c)toast('Спочатку обери чат');return}c.messages.push(['me',t,new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})]);$('input').value='';$('input').style.height='40px';save();render()};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};$('input').oninput=e=>{e.target.style.height='40px';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'};$('emoji').onclick=()=>{$('input').value+=' 😊';$('input').focus()};$('profile').onclick=()=>{let n=prompt('Твоє ім’я:',username);if(n&&n.trim()){username=n.trim().slice(0,40);localStorage.ptultra_name=username;render();toast('Профіль збережено')}};$('theme').onclick=()=>{light=!light;localStorage.ptultra_light=light?'1':'0';render()};$('info').onclick=()=>{let c=chat();alert(c?'Чат: '+c.name+'\nПовідомлень: '+c.messages.length+'\n\nЦе локальний демо-режим. Повідомлення не доставляються іншим людям.':'PersonalTelegram Ultra — демо-прототип')};if(current&&!chats.some(c=>c.id===current))current=null;render()})();
</script></body></html>
