<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Talky — твій месенджер</title>
<style>
:root{--bg:#0c1320;--panel:#111c2d;--panel2:#18263b;--line:#2a3a51;--txt:#eef4ff;--muted:#8fa3be;--accent:#78a4ff;--mine:#315e9e;--other:#1c2b41}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.layout{height:100dvh;display:grid;grid-template-columns:330px minmax(0,1fr);max-width:1500px;margin:auto}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{padding:20px 18px;font-weight:900;font-size:21px;letter-spacing:-.6px;color:var(--accent)}.brand span{color:var(--txt)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:3px}.search{margin:0 14px 12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;color:var(--txt);outline:none}.tabs{display:flex;gap:6px;padding:0 12px 12px}.tabs button,.soft{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;color:var(--muted);font-size:12px}.tabs button.active{background:#2b4770;color:#fff;border-color:#456ca8}.chats{overflow:auto;flex:1;padding:0 7px}.chat{display:flex;gap:11px;align-items:center;padding:12px 10px;border-radius:13px;cursor:pointer}.chat:hover,.chat.active{background:#243854}.avatar{height:45px;width:45px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(140deg,#62a1ef,#8968d9);color:white}.meta{min-width:0;flex:1}.name{font-weight:800}.preview{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.chatTop{display:flex;justify-content:space-between;gap:6px}.tiny{font-size:10px;color:var(--muted)}.sideBottom{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}.sideBottom .profileText{flex:1;min-width:0}.sideBottom button,.icon{background:transparent;border:0;color:var(--muted);padding:9px;border-radius:9px}.sideBottom button:hover,.icon:hover{background:var(--panel2)}.main{display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at top,#1a2a43,var(--bg) 70%)}.topbar{height:70px;display:flex;align-items:center;gap:12px;padding:12px 18px;background:#111c2ddd;border-bottom:1px solid var(--line)}.chatInfo{flex:1;min-width:0}.chatInfo small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.actions{display:flex;gap:3px}.icon{font-size:18px}.back{display:none}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:11px;padding:20px clamp(12px,4vw,55px)}.day{align-self:center;border:1px solid var(--line);background:#17263c;color:var(--muted);border-radius:20px;padding:6px 12px;font-size:10px}.bubble{max-width:min(78%,600px);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;padding:10px 13px;background:var(--other);border:1px solid #2c3c54;border-radius:16px 16px 16px 5px}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#315e9e,#464b96);border-color:#4c70ad;border-radius:16px 16px 5px 16px}.bubble .stamp{font-size:9px;text-align:right;color:#c6d5eb;margin-top:5px}.bubble .tools{display:flex;gap:8px;justify-content:flex-end;margin-top:5px}.bubble .tools button{border:0;background:#ffffff17;border-radius:6px;font-size:10px;padding:3px 6px}.bubble img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}.composerWrap{padding:8px 15px max(12px,env(safe-area-inset-bottom));background:#111c2dbb}.disclaimer{text-align:center;color:#7387a2;font-size:10px;padding:3px 0 9px}.composer{display:flex;gap:7px;align-items:flex-end;padding:7px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.composer textarea{flex:1;min-width:0;max-height:130px;min-height:42px;resize:none;padding:11px;background:transparent;color:var(--txt);border:0;outline:0}.send{width:43px;height:43px;border:0;border-radius:12px;background:linear-gradient(135deg,#7ba8ff,#a084ff);color:#101a2b;font-size:19px;font-weight:900}.empty{margin:auto;text-align:center;padding:28px}.empty .big{font-size:50px}.empty p{color:var(--muted);line-height:1.7;max-width:380px}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(420px,100%);max-height:85dvh;overflow:auto}.modal h2{margin:0 0 14px}.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:11px;border-radius:10px;margin:6px 0 12px}.modal label{font-size:12px;color:var(--muted)}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.primary{background:var(--accent);color:#101a2b;border:0;border-radius:10px;padding:10px 14px;font-weight:800}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#253b5a;border:1px solid #526b90;padding:12px 16px;border-radius:12px;display:none;z-index:20}.toast.show{display:block}.hide{display:none!important}.settingsList button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
@media(max-width:680px){.layout{grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.layout.open .sidebar{display:none}.layout.open .main{display:flex}.topbar{height:62px;padding:9px}.back{display:block}.messages{padding:14px 9px}.bubble{max-width:88%}.actions .desktopOnly{display:none}.brand{padding:15px 18px}}
body.light{--bg:#eef3fb;--panel:#fff;--panel2:#e8eef8;--line:#d4deed;--txt:#17243a;--muted:#667b96;--other:#fff}body.light .main{background:#eef3fb}body.light .topbar{background:#ffffffdd}body.light .chat.active,body.light .chat:hover{background:#e0eaff}
</style></head><body><div class="layout" id="layout"><aside class="sidebar"><div class="brand">➤ <span>Talky</span><small>YOUR OWN MESSENGER</small></div><input class="search" id="search" placeholder="⌕ Пошук чатів і повідомлень"><div class="tabs"><button class="active" data-filter="all">Усі</button><button data-filter="unread">Непрочитані</button><button id="newChat">＋ Чат</button></div><div class="chats" id="chats"></div><div class="sideBottom"><div class="avatar" id="myAvatar">Т</div><div class="profileText"><b id="myName">Твій профіль</b><div class="tiny">Демо-акаунт</div></div><button id="profileBtn" title="Профіль">⚙</button><button id="themeBtn" title="Тема">◐</button></div></aside><main class="main"><header class="topbar"><button class="icon back" id="back">‹</button><div class="avatar" id="headAvatar">?</div><div class="chatInfo"><b id="headName">Обери чат</b><small id="headStatus">Твій особистий простір</small></div><div class="actions"><button class="icon" id="findBtn" title="Знайти в чаті">⌕</button><button class="icon desktopOnly" id="exportBtn" title="Експортувати історію">⇩</button><button class="icon" id="moreBtn" title="Дії з чатом">⋯</button></div></header><section class="messages" id="messages"><div class="empty"><div class="big">💬</div><h2>Привіт у Talky!</h2><p>Обери демо-чат або створи новий. Це перша версія твого власного месенджера.</p><button class="primary" id="firstChat">＋ Створити чат</button></div></section><div class="composerWrap"><div class="disclaimer">Демо-прототип · повідомлення зберігаються лише в цьому браузері</div><form class="composer" id="form"><button type="button" class="icon" id="emoji" title="Емодзі">☺</button><button type="button" class="icon" id="attach" title="Прикріпити зображення">＋</button><input id="file" type="file" accept="image/*" class="hide"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Написати повідомлення..."></textarea><button class="send" type="submit">➤</button></form></div></main></div>
<div class="overlay" id="overlay"><div class="modal"><div id="modalBody"></div><div class="modalActions"><button class="soft" id="cancel">Скасувати</button><button class="primary" id="confirm">Зберегти</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const starter=[{id:'welcome',name:'Команда Talky',unread:false,messages:[{from:'them',text:'Привіт! 👋 Це твій власний месенджер-прототип.',time:'12:40'},{from:'me',text:'Круто! Що вже вмієш?',time:'12:41'},{from:'them',text:'Чати, пошук, повідомлення, емодзі, зображення, профіль, експорт історії та теми. Онлайн-сервер підключимо окремим етапом 🚀',time:'12:42'}]},{id:'friends',name:'Друзі',unread:true,messages:[{from:'them',text:'Марко: Як справи? 😄',time:'11:18'}]},{id:'family',name:'Родина',unread:false,messages:[{from:'them',text:'Гарного дня ❤️',time:'Вчора'}]},{id:'saved',name:'Збережене',unread:false,messages:[{from:'them',text:'Твої нотатки та ідеї 📝',time:'Пн'}]}];let chats;try{chats=JSON.parse(localStorage.talky_chats)||starter}catch(e){chats=starter}let current=localStorage.talky_current||'welcome',username=localStorage.talky_name||'Твій профіль',light=localStorage.talky_light==='1',filter='all',modalAction=null;const initial=s=>(s||'?').trim().slice(0,1).toUpperCase(),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.talky_chats=JSON.stringify(chats);localStorage.talky_current=current}catch(e){toast('Сховище браузера заповнене')}}function active(){return chats.find(c=>c.id===current)}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function stamp(){return new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}function renderChats(){let q=$('search').value.toLowerCase();$('chats').innerHTML='';chats.filter(c=>(filter!=='unread'||c.unread)&&(c.name+' '+c.messages.map(m=>m.text||'').join(' ')).toLowerCase().includes(q)).forEach(c=>{let el=document.createElement('div');el.className='chat'+(c.id===current?' active':'');let last=c.messages.at(-1);el.innerHTML='<div class="avatar">'+escapeHTML(initial(c.name))+'</div><div class="meta"><div class="chatTop"><span class="name">'+escapeHTML(c.name)+'</span><span class="tiny">'+escapeHTML(last?.time||'')+'</span></div><div class="preview">'+(c.unread?'🔵 ':'')+escapeHTML(last?.text||'Немає повідомлень')+'</div></div>';el.onclick=()=>select(c.id);$('chats').append(el)})}function renderMessages(){let c=active();if(!c)return;$('headName').textContent=c.name;$('headAvatar').textContent=initial(c.name);$('headStatus').textContent='Демо-чат · '+c.messages.length+' повідомлень';$('messages').innerHTML='<div class="day">Історія демо · сьогодні</div>';c.messages.forEach((m,i)=>{let b=document.createElement('div');b.className='bubble '+(m.from==='me'?'mine':'');let content=m.image?'<img src="'+m.image+'" alt="Прикріплене зображення">':'';content+=escapeHTML(m.text||'');content+='<div class="stamp">'+escapeHTML(m.time||'')+(m.from==='me'?' ✓✓':'')+'</div><div class="tools"><button data-copy="'+i+'">Копіювати</button><button data-react="'+i+'">❤️</button>'+(m.from==='me'?'<button data-delete="'+i+'">Видалити</button>':'')+'</div>';b.innerHTML=content;$('messages').append(b)});$('messages').scrollTop=$('messages').scrollHeight}function render(){document.body.classList.toggle('light',light);$('myName').textContent=username;$('myAvatar').textContent=initial(username);renderChats();if(active())renderMessages();else $('messages').innerHTML='<div class="empty"><div class="big">💬</div><h2>Обери чат</h2><p>Створи новий або вибери наявний у списку.</p></div>'}function select(id){current=id;let c=active();if(c)c.unread=false;save();render();$('layout').classList.add('open')}function createChat(){openModal('<h2>Новий чат</h2><label>Назва чату</label><input id="modalName" maxlength="50" placeholder="Наприклад, Друзі">',()=>{let n=$('modalName').value.trim();if(!n)return toast('Введи назву чату');let id='c'+Date.now();chats.unshift({id,name:n,unread:false,messages:[{from:'them',text:'Чат створено. Це локальна демоверсія.',time:stamp()}]});select(id);closeModal();toast('Чат створено')})}function openModal(html,fn){$('modalBody').innerHTML=html;modalAction=fn;$('overlay').classList.add('show')}function closeModal(){$('overlay').classList.remove('show');modalAction=null}$('cancel').onclick=closeModal;$('confirm').onclick=()=>modalAction&&modalAction();$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('newChat').onclick=$('firstChat').onclick=createChat;$('search').oninput=renderChats;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderChats()});$('back').onclick=()=>$('layout').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();let text=$('messageInput').value.trim(),c=active();if(!c){toast('Спочатку створи або обери чат');return}if(!text)return;c.messages.push({from:'me',text,time:stamp()});c.unread=false;$('messageInput').value='';$('messageInput').style.height='42px';save();render()};$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};$('messageInput').oninput=e=>{e.target.style.height='42px';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'};$('emoji').onclick=()=>{openModal('<h2>Обери емодзі</h2><div style="display:flex;flex-wrap:wrap;gap:8px;font-size:26px">'+['😀','😂','🥹','😍','😎','🤔','👍','❤️','🔥','🎉','👋','🙏','💯','🚀','💙','😅'].map(x=>'<button class="soft" data-emoji="'+x+'" style="font-size:23px">'+x+'</button>').join('')+'</div>',()=>closeModal());$('modalBody').querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{$('messageInput').value+=$(b).dataset.emoji;closeModal();$('messageInput').focus()})};$('attach').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0],c=active();if(!f)return;if(!c){toast('Спочатку обери чат');return}if(!f.type.startsWith('image/')){toast('У цій версії доступні зображення');return}if(f.size>1.5*1024*1024){toast('Зображення має бути до 1,5 МБ');return}let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});c.messages.push({from:'me',text:f.name,image:data,time:stamp()});save();render();e.target.value=''};$('messages').onclick=e=>{let c=active();if(!c)return;let copy=e.target.dataset.copy,del=e.target.dataset.delete,react=e.target.dataset.react;if(copy!==undefined){let m=c.messages[+copy];navigator.clipboard?.writeText(m.text||'Зображення').then(()=>toast('Скопійовано')).catch(()=>toast(m.text||'Зображення'))}if(del!==undefined){if(confirm('Видалити своє повідомлення?')){c.messages.splice(+del,1);save();render()}}if(react!==undefined){let m=c.messages[+react];m.reaction=m.reaction?'':'❤️';e.target.textContent=m.reaction?'❤️':'♡';toast(m.reaction?'Реакцію додано':'Реакцію прибрано')}};$('profileBtn').onclick=()=>openModal('<h2>Твій профіль</h2><label>Ім’я для відображення</label><input id="modalName" maxlength="40" value="'+escapeHTML(username)+'"><p class="tiny">У цій версії ім’я зберігається тільки в цьому браузері.</p>',()=>{let n=$('modalName').value.trim();if(n){username=n;localStorage.talky_name=n;render();closeModal();toast('Профіль збережено')}});$('themeBtn').onclick=()=>{light=!light;localStorage.talky_light=light?'1':'0';render()};$('findBtn').onclick=()=>{let c=active();if(!c)return;openModal('<h2>Пошук у чаті</h2><label>Слово або фраза</label><input id="modalName" placeholder="Що знайти?">',()=>{let q=$('modalName').value.toLowerCase();let hits=c.messages.map((m,i)=>({m,i})).filter(x=>(x.m.text||'').toLowerCase().includes(q));closeModal();if(!q)return toast('Введи пошуковий запит');toast('Знайдено: '+hits.length+' повідомлень');if(hits.length){let nodes=$('messages').querySelectorAll('.bubble');nodes[hits[0].i]?.scrollIntoView({behavior:'smooth',block:'center'})}})};function exportChat(){let c=active();if(!c)return toast('Обери чат');let blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='talky-chat.json';a.click();URL.revokeObjectURL(url);toast('Історію експортовано')} $('exportBtn').onclick=exportChat;$('moreBtn').onclick=()=>{let c=active();if(!c)return;openModal('<h2>Дії з чатом</h2><div class="settingsList"><button id="rename">✏️ Перейменувати чат</button><button id="export">⇩ Експортувати історію</button><button id="clear">🧹 Очистити історію</button><button id="remove">🗑 Видалити чат</button><button id="reset">↻ Скинути всі демодані</button></div>',()=>closeModal());$('confirm').textContent='Закрити';$('modalBody').querySelector('#rename').onclick=()=>{closeModal();openModal('<h2>Перейменувати чат</h2><input id="modalName" maxlength="50" value="'+escapeHTML(c.name)+'">',()=>{let n=$('modalName').value.trim();if(n)c.name=n;save();render();closeModal();$('confirm').textContent='Зберегти'})};$('modalBody').querySelector('#export').onclick=()=>{closeModal();$('confirm').textContent='Зберегти';exportChat()};$('modalBody').querySelector('#clear').onclick=()=>{if(confirm('Очистити всі повідомлення цього чату?')){c.messages=[];save();render();closeModal();$('confirm').textContent='Зберегти'}};$('modalBody').querySelector('#remove').onclick=()=>{if(confirm('Видалити цей чат?')){chats=chats.filter(x=>x.id!==c.id);current=chats[0]?.id||null;save();render();closeModal();$('confirm').textContent='Зберегти'}};$('modalBody').querySelector('#reset').onclick=()=>{if(confirm('Скинути демо-дані?')){chats=JSON.parse(JSON.stringify(starter));current='welcome';save();render();closeModal();$('confirm').textContent='Зберегти'}}};if(!active())current=chats[0]?.id||null;render()})();
</script></body></html>
